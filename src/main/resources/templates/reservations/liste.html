<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
<head>
    <title>Réservations - AutoLoc</title>
</head>
<body>
<main>
    <div class="titre-page">
        <h1>Réservations</h1>
        <a class="bouton bouton-principal bouton-ajout" th:href="@{/reservations/nouveau}">Nouvelle réservation</a>
    </div>
    <form th:replace="~{fragments/commun :: recherche('Client ou véhicule')}"></form>
    <div class="tableau-conteneur">
        <table class="tableau">
            <thead>
            <tr>
                <th>N°</th>
                <th>Client</th>
                <th>Véhicule</th>
                <th>Date de début</th>
                <th>Date de fin</th>
                <th>Statut</th>
                <th class="actions">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="objet : ${objets}">
                <td><a th:if="${objet != null}" th:href="@{/reservations/{id}(id=${objet.idReservation})}" th:text="${objet.idReservation}"></a><span th:if="${objet == null}">—</span></td>
                <td><a th:if="${objet.client != null}" th:href="@{/clients/{id}(id=${objet.client.idClient})}" th:text="${objet.client.nomComplet}"></a><span th:if="${objet.client == null}">—</span></td>
                <td><a th:if="${objet.vehicule != null}" th:href="@{/vehicules/{id}(id=${objet.vehicule.idVehicule})}" th:text="${objet.vehicule.libelle}"></a><span th:if="${objet.vehicule == null}">—</span></td>
                <td><span th:text="${objet.dateDebut != null} ? ${#temporals.format(objet.dateDebut, 'dd/MM/yyyy')} : '—'"></span></td>
                <td><span th:text="${objet.dateFin != null} ? ${#temporals.format(objet.dateFin, 'dd/MM/yyyy')} : '—'"></span></td>
                <td><span class="badge" th:classappend="${'badge-' + #strings.toLowerCase(objet.statut)}" th:text="${objet.statut.libelle}"></span></td>
                <td class="actions">
                    <th:block th:replace="~{fragments/commun :: actions(${objet.idReservation})}"></th:block>
                </td>
            </tr>
            <tr th:if="${objets.isEmpty()}">
                <td class="vide" colspan="7" th:text="${#strings.isEmpty(q)} ? 'Aucun élément pour le moment.' : 'Aucun résultat pour cette recherche.'"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <nav th:replace="~{fragments/commun :: pagination}"></nav>
</main>
</body>
</html>
