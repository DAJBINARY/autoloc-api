<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
<head>
    <title>Équipements - AutoLoc</title>
</head>
<body>
<main>
    <div class="titre-page">
        <h1>Équipements</h1>
        <a class="bouton bouton-principal" th:href="@{/equipements/nouveau}">Nouvel équipement</a>
    </div>
    <form th:replace="~{fragments/commun :: recherche('Libellé')}"></form>
    <div class="tableau-conteneur">
        <table class="tableau">
            <thead>
            <tr>
                <th>Libellé</th>
                <th class="actions">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="objet : ${objets}">
                <td><a th:if="${objet != null}" th:href="@{/equipements/{id}(id=${objet.idEquipement})}" th:text="${objet.libelle}"></a><span th:if="${objet == null}">—</span></td>
                <td class="actions">
                    <th:block th:replace="~{fragments/commun :: actions(${objet.idEquipement})}"></th:block>
                </td>
            </tr>
            <tr th:if="${objets.isEmpty()}">
                <td class="vide" colspan="2" th:text="${#strings.isEmpty(q)} ? 'Aucun élément pour le moment.' : 'Aucun résultat pour cette recherche.'"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <nav th:replace="~{fragments/commun :: pagination}"></nav>
</main>
</body>
</html>
