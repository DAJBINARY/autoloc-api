<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
<head>
    <title>Paiements - AutoLoc</title>
</head>
<body>
<main>
    <div class="titre-page">
        <h1>Paiements</h1>
        <a class="bouton bouton-principal" th:href="@{/paiements/nouveau}">Nouveau paiement</a>
    </div>
    <form th:replace="~{fragments/commun :: recherche('Client')}"></form>
    <div class="tableau-conteneur">
        <table class="tableau">
            <thead>
            <tr>
                <th>N°</th>
                <th>Contrat</th>
                <th>Date</th>
                <th>Mode</th>
                <th class="nombre">Montant</th>
                <th class="actions">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="objet : ${objets}">
                <td><a th:if="${objet != null}" th:href="@{/paiements/{id}(id=${objet.idPaiement})}" th:text="${objet.idPaiement}"></a><span th:if="${objet == null}">—</span></td>
                <td><a th:if="${objet.contrat != null}" th:href="@{/contrats/{id}(id=${objet.contrat.idContrat})}" th:text="${objet.contrat.libelle}"></a><span th:if="${objet.contrat == null}">—</span></td>
                <td><span th:text="${objet.datePaiement != null} ? ${#temporals.format(objet.datePaiement, 'dd/MM/yyyy')} : '—'"></span></td>
                <td><span th:text="${objet.modePaiement?.libelle} ?: '—'"></span></td>
                <td class="nombre"><span th:text="${#numbers.formatDecimal(objet.montant, 1, 'WHITESPACE', 2, 'COMMA')} + ' €'"></span></td>
                <td class="actions">
                    <th:block th:replace="~{fragments/commun :: actions(${objet.idPaiement})}"></th:block>
                </td>
            </tr>
            <tr th:if="${objets.isEmpty()}">
                <td class="vide" colspan="6" th:text="${#strings.isEmpty(q)} ? 'Aucun élément pour le moment.' : 'Aucun résultat pour cette recherche.'"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <nav th:replace="~{fragments/commun :: pagination}"></nav>
</main>
</body>
</html>
