<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>

<form th:fragment="recherche(indice)" class="recherche" role="search" method="get" th:action="@{/{s}(s=${section})}">
    <span class="recherche-champ">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
        <input type="search" name="q" th:value="${q}" th:placeholder="${indice}" th:aria-label="${indice}">
    </span>
    <button class="bouton" type="submit">Rechercher</button>
    <a class="bouton bouton-discret" th:unless="${#strings.isEmpty(q)}" th:href="@{/{s}(s=${section})}">Effacer</a>
    <span class="recherche-compte" th:with="total=${objets.totalElements}" th:text="|${total} résultat${total > 1 ? 's' : ''}|"></span>
</form>

<nav th:fragment="pagination" class="pagination" aria-label="Pagination" th:if="${objets.totalPages > 1}">
    <a class="bouton" th:if="${objets.hasPrevious()}"
       th:href="@{/{s}(s=${section},q=${q},page=${objets.number - 1})}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        Précédent</a>
    <span th:text="|Page ${objets.number + 1} sur ${objets.totalPages}|"></span>
    <a class="bouton" th:if="${objets.hasNext()}"
       th:href="@{/{s}(s=${section},q=${q},page=${objets.number + 1})}">
        Suivant
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></a>
</nav>

<div th:fragment="actions(id)" class="actions-ligne">
    <a class="bouton-icone" title="Voir" aria-label="Voir" th:href="@{/{s}/{id}(s=${section},id=${id})}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.8"/></svg>
    </a>
    <a class="bouton-icone" title="Modifier" aria-label="Modifier" th:if="${estManager or (section != 'agences' and section != 'employes')}"
       th:href="@{/{s}/{id}/modifier(s=${section},id=${id})}">
        <svg th:replace="~{fragments/commun :: icone-modifier}"></svg>
    </a>
    <form th:if="${estManager}" th:action="@{/{s}/{id}/supprimer(s=${section},id=${id})}" method="post"
          onsubmit="return confirm('Supprimer cet élément ?');">
        <button class="bouton-icone bouton-icone-danger" type="submit" title="Supprimer" aria-label="Supprimer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M9.5 7V4.5h5V7"/><path d="m6 7 1 13h10l1-13"/><path d="M10 11v5.5M14 11v5.5"/></svg>
        </button>
    </form>
</div>

<svg th:fragment="icone-modifier" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/></svg>

<a th:fragment="retour" class="retour" th:href="@{/{s}(s=${section})}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m11 6-6 6 6 6"/></svg>
    Retour à la liste
</a>

</body>
</html>
