<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
<head>
    <title>Agences - AutoLoc</title>
</head>
<body>
<main>
    <h1 th:text="${modification} ? 'Modifier l\'agence' : 'Nouvelle agence'">Nouvelle agence</h1>
    <form class="formulaire" th:action="@{${action}}" th:object="${objet}" method="post">
        <p class="alerte alerte-erreur" role="alert" th:if="${#fields.hasGlobalErrors()}" th:text="${#fields.globalErrors()[0]}"></p>
            <div class="champ">
                <label th:for="nom">Nom</label>
                <input type="text" th:field="*{nom}" th:errorclass="invalide" required>
                <p class="erreur-champ" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></p>
            </div>
            <div class="champ">
                <label th:for="ville">Ville</label>
                <input type="text" th:field="*{ville}" th:errorclass="invalide" required>
                <p class="erreur-champ" th:if="${#fields.hasErrors('ville')}" th:errors="*{ville}"></p>
            </div>
            <div class="champ">
                <label th:for="adresse">Adresse</label>
                <input type="text" th:field="*{adresse}" th:errorclass="invalide" required>
                <p class="erreur-champ" th:if="${#fields.hasErrors('adresse')}" th:errors="*{adresse}"></p>
            </div>
            <div class="champ">
                <label th:for="telephone">Téléphone</label>
                <input type="tel" th:field="*{telephone}" th:errorclass="invalide" required>
                <p class="erreur-champ" th:if="${#fields.hasErrors('telephone')}" th:errors="*{telephone}"></p>
            </div>
        <div class="boutons">
            <button class="bouton bouton-principal" type="submit">Enregistrer</button>
            <a class="bouton" th:href="@{/agences}">Annuler</a>
        </div>
    </form>
</main>
</body>
</html>
