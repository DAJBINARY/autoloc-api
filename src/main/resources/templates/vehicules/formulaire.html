<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: page(~{::title}, ~{::main})}">
<head>
    <title>Véhicules - AutoLoc</title>
</head>
<body>
<main>
    <div class="titre-formulaire">
        <a th:replace="~{fragments/commun :: retour}"></a>
        <h1 th:text="${modification} ? 'Modifier le véhicule' : 'Nouveau véhicule'">Nouveau véhicule</h1>
    </div>
    <form class="formulaire formulaire-rubriques" th:action="@{${action}}" th:object="${objet}" method="post">
        <p class="alerte alerte-erreur" role="alert" th:if="${#fields.hasGlobalErrors()}" th:text="${#fields.globalErrors()[0]}"></p>
        <section class="rubrique">
            <div class="rubrique-tete">
                <h2>Identification</h2>
                <p>Ce qui permet de reconnaître le véhicule.</p>
            </div>
            <div class="grille-champs">
                <div class="champ champ-plein">
                    <label th:for="immatriculation">Immatriculation</label>
                    <input type="text" th:field="*{immatriculation}" th:errorclass="invalide" required>
                    <p class="erreur-champ" th:if="${#fields.hasErrors('immatriculation')}" th:errors="*{immatriculation}"></p>
                </div>
                <div class="champ">
                    <label th:for="marque">Marque</label>
                    <input type="text" th:field="*{marque}" th:errorclass="invalide" required>
                    <p class="erreur-champ" th:if="${#fields.hasErrors('marque')}" th:errors="*{marque}"></p>
                </div>
                <div class="champ">
                    <label th:for="modele">Modèle</label>
                    <input type="text" th:field="*{modele}" th:errorclass="invalide" required>
                    <p class="erreur-champ" th:if="${#fields.hasErrors('modele')}" th:errors="*{modele}"></p>
                </div>
                <div class="champ champ-plein">
                    <label th:for="categorie">Catégorie</label>
                    <select th:field="*{categorie}" th:errorclass="invalide" required>
                        <option value="">Choisir…</option>
                        <option th:each="valeur : ${categories}" th:value="${valeur}" th:text="${valeur.libelle}"></option>
                    </select>
                    <p class="erreur-champ" th:if="${#fields.hasErrors('categorie')}" th:errors="*{categorie}"></p>
                </div>
            </div>
        </section>
        <section class="rubrique">
            <div class="rubrique-tete">
                <h2>Exploitation</h2>
                <p>Son rattachement, son tarif et son état dans la flotte.</p>
            </div>
            <div class="grille-champs">
                <div class="champ">
                    <label for="agence">Agence</label>
                    <select id="agence" name="agence" th:errorclass="invalide" required>
                        <option value="">Choisir…</option>
                        <option th:each="choix : ${agences}" th:value="${choix.idAgence}" th:text="${choix.nom}"
                                th:selected="${objet.agence?.idAgence == choix.idAgence}"></option>
                    </select>
                    <p class="aide" th:if="${#lists.isEmpty(agences)}">Aucune agence pour le moment. <a th:href="@{/agences/nouveau}">En créer un</a></p>
                    <p class="erreur-champ" th:if="${#fields.hasErrors('agence')}" th:errors="*{agence}"></p>
                </div>
                <div class="champ">
                    <label th:for="tarifJournalier">Tarif journalier (€)</label>
                    <input type="number" min="0.01" step="0.01" th:field="*{tarifJournalier}" th:errorclass="invalide" required>
                    <p class="erreur-champ" th:if="${#fields.hasErrors('tarifJournalier')}" th:errors="*{tarifJournalier}"></p>
                </div>
                <div class="champ">
                    <label th:for="statut">Statut</label>
                    <select th:field="*{statut}" th:errorclass="invalide" required>
                        <option value="">Choisir…</option>
                        <option th:each="valeur : ${statuts}" th:value="${valeur}" th:text="${valeur.libelle}"></option>
                    </select>
                    <p class="erreur-champ" th:if="${#fields.hasErrors('statut')}" th:errors="*{statut}"></p>
                </div>
                <div class="champ">
                    <label th:for="placeParking">Place de parking <span class="facultatif">(facultatif)</span></label>
                    <input type="number" min="1" max="500" step="1" th:field="*{placeParking}" th:errorclass="invalide">
                    <p class="erreur-champ" th:if="${#fields.hasErrors('placeParking')}" th:errors="*{placeParking}"></p>
                </div>
            </div>
        </section>
        <section class="rubrique" th:unless="${#lists.isEmpty(equipementsDisponibles)}">
            <div class="rubrique-tete">
                <h2>Équipements</h2>
                <p>Ce que le client trouvera à bord.</p>
            </div>
            <div class="grille-champs">
                <fieldset class="champ cases champ-plein">
                    <legend class="masque">Équipements</legend>
                    <div class="cases-liste">
                        <label th:each="equipement : ${equipementsDisponibles}">
                            <input type="checkbox" name="equipements" th:value="${equipement.idEquipement}"
                                   th:checked="${objet.equipements.![idEquipement].contains(equipement.idEquipement)}">
                            <span th:text="${equipement.libelle}"></span>
                        </label>
                    </div>
                </fieldset>
            </div>
        </section>
        <div class="boutons">
            <a class="bouton bouton-discret" th:href="@{/vehicules}">Annuler</a>
            <button class="bouton bouton-principal" type="submit">Enregistrer</button>
        </div>
    </form>
</main>
</body>
</html>
