spring.application.name=autoloc-api

# Database connection
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Existing rows have no links yet: a required link is checked by the forms, not by the column
spring.jpa.properties.hibernate.validator.apply_to_ddl=false

# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.fr.ece.autoloc=INFO

# Web interface
spring.web.locale=fr
spring.web.locale-resolver=fixed
spring.mvc.format.date=iso
