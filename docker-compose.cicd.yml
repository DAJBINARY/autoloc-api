# CI/CD stack of AutoLoc, in a single file:
#   - CI: Jenkins + SonarQube (and its PostgreSQL database)
#   - Monitoring: Prometheus collects the application's metrics, Grafana displays them
#     (the application itself runs on the host, port 8080)
# Start:  docker compose -f docker-compose.cicd.yml --env-file ci/.env up -d --build
# Jenkins: http://localhost:8090   SonarQube: http://localhost:9000
# Prometheus: http://localhost:19090   Grafana: http://localhost:3000
name: cicd

services:
  # ---------------------------------------------------------------- CI
  jenkins:
    build: ./ci/jenkins
    container_name: jenkins
    # root so that the pipeline can use the host's Docker socket (local CI only)
    user: root
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD}
      SONAR_TOKEN: ${SONAR_TOKEN}
      DOCKERHUB_USER: ${DOCKERHUB_USER}
      DOCKERHUB_TOKEN: ${DOCKERHUB_TOKEN}
      CI_DB_PASSWORD: ${CI_DB_PASSWORD}
    volumes:
      - jenkins-home:/var/jenkins_home
      # Maven dependencies kept between builds
      - jenkins-m2:/root/.m2
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - ci
    # Public resolvers: some networks (phone hotspots with DNS64) only return IPv6 addresses
    # for github.com, which containers cannot reach
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      sonarqube:
        condition: service_healthy
    restart: unless-stopped

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}
      # Docker Desktop does not let Elasticsearch raise vm.max_map_count
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
      # The quality gate webhook targets the "jenkins" container, a private address that
      # SonarQube refuses by default
      SONAR_VALIDATEWEBHOOKS: "false"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    networks:
      - ci
    depends_on:
      sonar-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  sonar-db:
    image: postgres:17-alpine
    container_name: sonar-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD}
      POSTGRES_DB: sonar
    volumes:
      - sonar-db-data:/var/lib/postgresql/data
    networks:
      - ci
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ---------------------------------------------------------------- Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: autoloc-prometheus
    ports:
      # 9090 falls in a port range reserved by Windows on this machine
      - "127.0.0.1:19090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: autoloc-grafana
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - monitoring
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  ci:
    # Fixed name: the pipeline attaches its disposable MySQL container to it
    name: autoloc-ci
  monitoring:

# Explicit names: they keep the volumes created by the two former compose files
# (projects "ci" and "autoloc-api"), so no data is lost
volumes:
  jenkins-home:
    name: ci_jenkins-home
  jenkins-m2:
    name: ci_jenkins-m2
  sonarqube-data:
    name: ci_sonarqube-data
  sonarqube-extensions:
    name: ci_sonarqube-extensions
  sonarqube-logs:
    name: ci_sonarqube-logs
  sonar-db-data:
    name: ci_sonar-db-data
  prometheus-data:
    name: autoloc-api_prometheus-data
  grafana-data:
    name: autoloc-api_grafana-data
