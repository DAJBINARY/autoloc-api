# Monitoring stack: Prometheus collects the application's metrics, Grafana displays them.
# The application itself runs on the host (port 8080).
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: autoloc-prometheus
    ports:
      # 9090 falls in a port range reserved by Windows on this machine
      - "127.0.0.1:19090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: autoloc-grafana
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
